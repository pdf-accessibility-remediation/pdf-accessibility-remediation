<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Order Review</title>
<style>
:root {
  color-scheme: light dark;            /* scrollbars and form controls follow the theme */
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #5f5f5a; --line: #d9d9d4;
  --accent: #1f5fae; --ok: #1d7a3e; --change: #9a5b00; --reject: #b3261e; --seen: #5a4fa8; --flag: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1e; --ink: #ecece8; --muted: #a3a39c; --line: #3a3a37;
          --accent: #7fb0f0; --ok: #6fcf8f; --change: #f0b45c; --reject: #f08a80; --seen: #b3a9f5; --flag: #3a3220; }
}
* { box-sizing: border-box; }
/* a jump to a card or section lands below the sticky header. On the targets, not as html's scroll-padding: that padding
   also covered the header's own reviewer field, so the browser scrolled the list on every key typed there */
main [id] { scroll-margin-top: calc(var(--top, 0px) + 8px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: center; }
.actions { display: flex; gap: 10px; }
.show label { margin-left: 8px; }
.bar { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--accent); }
button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (prefers-color-scheme: dark) { button.primary { color: #111; } }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
textarea { width: 100%; max-width: 100%; min-height: 3.2em; resize: vertical; }   /* taller only: never wider than its box */
.sname { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 0; } .sname[hidden] { display: none; }
/* Reviewer and Session Name as one group, 18 px apart (closer than the row's 32 px); on a narrow screen each starts at
   the left edge of its own line */
.who { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.sname label { margin-right: 4px; } .sname #notesBtn { margin-left: 18px; }   /* the name close to its box; the notes button apart */
/* "Back to the Run Page": a link (it goes to another page) that looks like the header's buttons */
a.btnlink { display: inline-block; font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; }
a.btnlink:hover { text-decoration: underline; }
#back { margin: 0; }
/* Hide Header at the header's bottom right; while hidden, Show Header at the window's top right */
.hdr-foot { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
#hideHdr { margin-left: auto; font-size: 13px; padding: 3px 10px; }
#showHdr { position: fixed; top: 8px; right: 16px; z-index: 6; font-size: 13px; padding: 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
header.top[hidden], #showHdr[hidden] { display: none; }
/* the notepad: the session's notes beside the page (not modal), moved by its title bar, resized from its corner */
dialog.npad { position: fixed; margin: 0; padding: 0; inset: auto; width: min(420px, 92vw); height: 280px; min-width: 220px; min-height: 140px;
              max-width: 100vw; max-height: 100vh; resize: both; overflow: hidden; z-index: 30; border: 1px solid var(--muted);
              border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
dialog.npad[open] { display: flex; flex-direction: column; }
.npad-bar { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; background: var(--bg); border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
.npad-bar h2 { flex: 1; font-size: 15px; margin: 0; }
.npad-bar button, .msg-x { min-width: 28px; min-height: 28px; padding: 0 6px; border: 0; background: none; color: var(--ink); font-size: 18px; line-height: 1; }
dialog.npad textarea { flex: 1; resize: none; border: 0; border-radius: 0 0 8px 8px; min-height: 0; }
.npad-restore { position: fixed; right: 16px; bottom: 16px; z-index: 30; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.npad-restore[hidden] { display: none; }
/* "All changes saved" / "Saving…" / "Not saved": right of Finish Review, in a fixed width, so nothing moves when it changes */
.save-state { align-self: center; font-size: 13px; color: var(--muted); white-space: nowrap; display: inline-block; width: 9.5em; }
.save-state[hidden] { display: none; }
/* the check's verdict beside it (announced, only when its words change), and a problem under the field it is about */
.check-line { align-self: center; font-size: 13px; color: var(--muted); white-space: nowrap; } .check-line.bad { color: var(--reject); font-weight: 600; }
.check-line[hidden], #checkBtn[hidden] { display: none; }
.field-err { margin: 6px 0; padding: 4px 10px; border-left: 4px solid var(--reject); color: var(--reject); font-size: 14px; }
.field-err[hidden] { display: none; } .field-err a { color: inherit; }
[aria-invalid="true"] { border-color: var(--reject); box-shadow: 0 0 0 1px var(--reject); }
.save-alert:empty { display: none; } .save-alert { margin-top: 6px; font-size: 14px; color: var(--reject); font-weight: 600; }
.fin-check { border-left: 4px solid var(--change); background: var(--bg); padding: 6px 10px; margin: 8px 0; font-size: 14px; }
.fin-check ul { margin: 4px 0 0; padding-left: 20px; } .fin-check.err { border-left-color: var(--reject); }
#msg { margin-top: 6px; font-size: 14px; }
.draft-line { margin-top: 6px; font-size: 14px; } .draft-line[hidden] { display: none; }
.hand-edit { margin-top: 4px; }
.draft-line .note { color: var(--muted); } .draft-line ul { margin: 4px 0 0 1.2em; padding: 0; } .draft-line a { color: var(--accent); }
.draft-line .stale { color: var(--reject); font-weight: 600; }
.draft-line details { display: inline-block; margin-left: 4px; } .draft-line summary { cursor: pointer; color: var(--accent); }
#msg:has(.msg-x) { display: flex; align-items: flex-start; gap: 8px; } #msg .msg-t { flex: 1; padding-top: 4px; }
#msg.err { color: var(--reject); }
#session { margin-top: 6px; font-size: 14px; color: var(--muted); }
#session b { color: inherit; } #session a { color: var(--accent); }
main { display: flex; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
nav { flex: 0 0 232px; padding-right: 12px; scrollbar-gutter: stable; position: sticky; top: calc(var(--top, 0px) + 8px); align-self: flex-start; max-height: calc(100vh - var(--top, 0px) - 24px); overflow: auto; overscroll-behavior: contain; font-size: 14px; }   /* its scrolling never moves the page */
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
nav a { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); text-decoration: none; padding: 2px 4px; border-radius: 4px; }
nav a:hover { background: var(--line); }
.col { flex: 1; min-width: 0; }
.card.added { border-left-color: var(--accent); }
.card.hand { border-left-color: var(--change); } .card.hand[data-done] { border-left-color: var(--ok); }
.earlier details { margin: 0 0 6px; } .earlier summary { cursor: pointer; } .earlier .ctx { margin: 0 0 8px; }
.earlier table { border-collapse: collapse; width: 100%; font-size: 14px; } .earlier td, .earlier th { border-top: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
#addPanel { background: var(--panel); border: 2px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#addPanel h2 { font-size: 16px; margin: 0 0 4px; }
#addPanel .pick { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 6px 0; }
#addPanel select[data-add=target] { width: 100%; }
#addPanel .buttons { display: flex; gap: 10px; margin-top: 8px; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; max-width: min(680px, 94vw); padding: 14px 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { font-size: 16px; margin: 0 0 6px; }
dialog .gap { border-top: 1px solid var(--line); padding: 8px 0; }
dialog .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 8px; }
#msg a { color: var(--accent); }
#gapErr { color: var(--reject); }
section > h2 { font-size: 16px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.card[data-status=approved] { border-left-color: var(--ok); }
.card[data-status=changed] { border-left-color: var(--change); }
.card[data-status=rejected] { border-left-color: var(--reject); }
.card[data-status=seen] { border-left-color: var(--seen); }
.card:not([data-status]) { opacity: .92; }
.flag { background: var(--flag); padding: 0 6px; border-radius: 4px; color: var(--ink); }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0 0 4px; }
.fields dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.fields dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.fields pre { margin: 0; }
.edit-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.exact { font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
.exact summary { cursor: pointer; }
.card .id { font-size: 11px; color: var(--muted); margin-top: 6px; }
.card .id code { font-size: 11px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } .fields dd { margin-bottom: 4px; } }
.ctx { font-size: 14px; color: var(--muted); margin: 4px 0; overflow-wrap: anywhere; }
pre { font-size: 12px; background: var(--bg); padding: 6px; border-radius: 6px; overflow: auto; max-height: 220px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.imgs figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.imgs img { max-height: 220px; max-width: 100%; border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; }
.imgs figure.here img { outline: 3px solid var(--accent); }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }   /* a section, card or heading focused by script: no outline */
.controls { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 6px; }
.controls label { cursor: pointer; }
button.clear { padding: 1px 8px; font-size: 13px; color: var(--muted); }
.navbar { display: none; }
#navToggle { display: inline-flex; align-items: center; gap: 8px; border-color: var(--accent); color: var(--accent); font-weight: 600; }
#navToggle svg { width: 18px; height: 18px; }
.nav-head { display: none; }
#navBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
#navBackdrop[hidden] { display: none; }
.imgs figure.word img { max-height: 90px; }
.edit { margin-top: 6px; }
.edit textarea { min-height: 4.5em; }
.note { margin-top: 6px; }
.note textarea { min-height: 2.2em; font-size: 14px; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
#zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
.done { padding: 12px 16px; background: var(--flag); border-radius: 8px; margin: 10px 0; }
#readingOrder { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin: 0 0 16px; }
#readingOrder summary { cursor: pointer; font-weight: 600; }
#readingOrder ol { list-style: none; margin: 6px 0 0; padding: 0; font-size: 14px; }
#readingOrder li { border-top: 1px solid var(--line); padding: 2px 0; }
#readingOrder ul.ro-find { margin: 6px 0; padding-left: 20px; }
#readingOrder ul.ro-find li { border-top: 0; padding: 2px 0; }
.ro-row { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 4px; color: var(--ink); overflow-wrap: anywhere; }
.ro-row:hover { background: var(--bg); }
.ro-skip .ro-row { color: var(--muted); }
.ro-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
.ro-cmp ol { margin: 2px 0; padding-left: 22px; font-size: 13px; }
.ro-cmp .moved { font-weight: 600; }
@media (max-width: 560px) { .ro-cmp { grid-template-columns: 1fr; } }
/* the session's notes (its name is in the header); the notes of the session this one started from, read-only. The box is a
   block, so no line gap under it: the fold below sits centred between the box and the section's edge */
#this-session textarea { display: block; }
#this-session { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#this-session > h2 { margin-top: 0; }
#this-session h2 label { display: block; cursor: pointer; }   /* the section's heading is the notes box's label */
#finishDialog label { display: block; font-weight: 600; margin: 6px 0 2px; }
#this-session textarea, #finishDialog textarea { min-height: 5em; }
#finishDialog input[type=text] { width: 100%; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.from-notes { margin-top: 10px; }
.from-notes summary { cursor: pointer; }
.from-notes .pre { background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
/* OCR Text: the book's OCR text, shown as it is, and a person's verdict on it (never an edit of the text) */
#ocr-text { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#ocr-text > h2 { margin-top: 0; }
#ocr-text fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 0 10px 6px; }
#ocr-text legend { font-weight: 600; padding: 0 4px; margin-bottom: -2px; }
/* each choice: its radio centred on its label, the name semi-bold */
#ocr-text fieldset label { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; white-space: nowrap; position: relative; top: 1px; }
#ocr-text .ctx b { font-weight: 600; }   /* in the section's helper lines, names of buttons, choices and sections: semi-bold, no quotes */
#ocr-text fieldset input[type=radio] { margin: 0; }
#ocr-text .cur-verdict { margin-bottom: 2px; }
#ocr-text .prev-verdicts { margin: 0 0 10px; } #ocr-text .prev-verdicts ul { margin-top: 2px; }
#ocr-text .field { margin: 6px 0; }
#ocr-text .field > label { display: block; font-weight: 600; margin-bottom: 2px; }
#ocr-text .field input[type=text] { width: 100%; max-width: 40em; }
#ocr-text #ocrMsg { margin: 8px 0; }
#ocr-text #ocrMsg.err { color: var(--reject); }
.ocr-card h3 { font-size: 15px; margin: 0 0 6px; }
.ocr-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.ocr-pair img { max-width: 100%; border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; }
.ocr-pair pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 520px; font-size: 13px; margin: 0; }
.ocr-card ul { margin: 6px 0; padding-left: 20px; font-size: 14px; }
@media (max-width: 800px) { .ocr-pair { grid-template-columns: 1fr; } }
@media (max-width: 800px) {
  main { flex-direction: column; padding: 16px; }
  header.top { position: static; }
  .navbar { display: block; position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  /* the side list becomes a drawer over the page: the cards never move */
  /* align-self: stretch, or the desktop flex-start makes the drawer as tall as its list and nothing scrolls */
  nav { position: fixed; top: 0; bottom: 0; left: 0; align-self: stretch; width: min(300px, 85vw); max-height: none; overscroll-behavior: contain; z-index: 20; background: var(--panel);
        box-shadow: 2px 0 16px rgba(0,0,0,.35); padding: 8px 16px 16px; transform: translateX(-100%); visibility: hidden;
        transition: transform .2s ease, visibility 0s linear .2s; }
  body.nav-open nav { transform: none; visibility: visible; transition: transform .2s ease; }
  .nav-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
}
@media (prefers-reduced-motion: reduce) { nav { transition: none !important; } }
</style>
</head>
<body>
<button type="button" id="showHdr" class="hdr-toggle" aria-expanded="false" aria-controls="top" hidden>Show Header</button>
<header class="top" id="top">
  <h1 id="title" tabindex="-1">Work Order Review</h1>
  <div class="row">
    <span class="who"><label>Reviewer <input type="text" id="reviewer" placeholder="Your Name" size="18"></label>
    <span class="sname"><label for="sessionName">Session Name</label><input type="text" id="sessionName" maxlength="80" size="18"><button type="button" id="notesBtn" aria-expanded="false" aria-controls="notepad">Session Notes</button></span></span>
    <span><span class="bar"><i id="bar"></i></span> <span id="progress"></span></span>
    <span class="show" role="radiogroup" aria-label="Show">Show:
      <label><input type="radio" name="view" value="priority" checked> Check First</label>
      <label><input type="radio" name="view" value="all"> All</label>
      <label><input type="radio" name="view" value="left"> Not Reviewed</label>
    </span>
    <span class="actions"><button id="addBtn" type="button">Add a Decision</button>
    <button id="draftBtn" type="button">Build a Draft PDF</button>
    <button id="finish" class="primary">Finish Review</button><button id="closeOcr" type="button" hidden>Close Without a Verdict</button>
    <span id="saveState" class="save-state">All changes saved</span><span id="checkLine" class="check-line" role="status"></span><button type="button" id="checkBtn" hidden>Show Details</button></span>
  </div>
  <div id="saveAlert" role="alert" class="save-alert"></div>
  <div id="draftLine" class="draft-line" aria-live="polite" hidden></div>
  <div id="msg" role="status"></div>
  <div id="session" hidden></div>
  <div id="handEdit" class="hand-edit" hidden></div>
  <div class="hdr-foot"><p id="back" hidden><a href="" class="btnlink">Back to the Run Page</a> (this review stays open; continue it from there)</p>
  <button type="button" id="hideHdr" class="hdr-toggle" aria-expanded="true" aria-controls="top">Hide Header</button></div>
</header>
<!-- the session's notes as a notepad beside the page: the same note as the Session Notes box (typing in either updates both) -->
<dialog id="notepad" class="npad" aria-labelledby="npadTitle">
  <div class="npad-bar"><h2 id="npadTitle">Session Notes</h2>
    <button type="button" id="npadMin" aria-label="Minimize Session Notes"><span aria-hidden="true">–</span></button>
    <button type="button" id="npadX" aria-label="Close Session Notes"><span aria-hidden="true">×</span></button></div>
  <textarea id="padNotes" maxlength="4000" aria-labelledby="npadTitle"></textarea>
</dialog>
<button type="button" id="npadRestore" class="npad-restore" hidden>Session Notes</button>
<div class="navbar"><button id="navToggle" type="button" aria-expanded="false" aria-controls="nav">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>Sections</button></div>
<div id="navBackdrop" hidden></div>
<main>
  <nav id="nav" aria-label="Sections"><div class="nav-head"><span>Sections</span><button id="navClose" type="button" aria-label="Close Sections"><span aria-hidden="true">×</span></button></div><div id="navList"></div></nav>
  <div class="col">
    <section id="this-session" aria-labelledby="tsTitle"><h2 id="tsTitle"><label for="sessionNotes">Session Notes (optional)</label></h2>
      <textarea id="sessionNotes" maxlength="4000"></textarea>
      <div id="fromNotes"></div>
    </section>
    <section id="ocr-text" aria-labelledby="ocrTitle" hidden></section>
    <div id="addPanel" hidden></div><div id="roPark" hidden><div id="readingOrder"></div></div><div id="cards"></div></div>
</main>
<div id="zoom"><img alt=""></div>
<dialog id="gapDialog" aria-labelledby="gapTitle" aria-describedby="gapCtx"></dialog>
<dialog id="finishDialog" aria-labelledby="finTitle" aria-describedby="finCtx"></dialog>
<dialog id="checkDialog" aria-labelledby="chkTitle"></dialog>
<script>
const DATA = /*REVIEW_DATA*/null;
// the browser draft belongs to one run and one session (the run id is written once, in reviews/basis.json)
const SESSION = DATA.session || null;
const KEY = SESSION && SESSION.key ? 'review:' + SESSION.key : 'review:' + DATA.book + ':' + DATA.run;
const SEEN_ONLY = new Set(['deferrals', 'notes_for_reviewer', 'reading_order']);
const items = DATA.items, byId = Object.fromEntries(items.map(it => [it.id, it]));
const RO_GROUP = Number(Object.keys(DATA.groups).find(g => DATA.groups[g] === 'Reading order'));   // review/core.py GROUPS
const ADDABLE = DATA.addable || {}, ADD_KINDS = DATA.add_kinds || {};
const addById = Object.fromEntries(Object.values(ADDABLE).flat().map(t => [t.id, t]));
const aid = a => 'add:' + a.kind + ':' + a.target;
// the server's saved choices, or this browser's when they are newer (both stamped with the browser's clock)
const srv = DATA.saved || {};
let state = { reviewer: srv.reviewer || '', decisions: srv.decisions || {}, additions: srv.additions || [],
              session_name: srv.session_name || '', session_notes: srv.session_notes || '', saved_at: srv.saved_at || '' };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && s.decisions && (!state.saved_at || (s.saved_at && new Date(s.saved_at) >= new Date(state.saved_at)))) state = Object.assign({ additions: [] }, s);
} catch (e) {}
state.additions = (state.additions || []).filter(a => addById[aid(a)]);
let view = 'priority', finished = false;
let draftPoll = null, draftBasis = null, draftStale = false, draftLast = null;   // Build a Draft PDF (below)
const RETURN_TO = DATA.return_to || null;             // the app's run page (review_workorder.py --return-to), else the terminal
if (RETURN_TO) { const b = document.getElementById('back'); b.hidden = false; b.querySelector('a').href = RETURN_TO.split('?')[0]; }

const SMALL = new Set(['a', 'an', 'the', 'and', 'or', 'of', 'to', 'in', 'on', 'for', 'by', 'from', 'with', 'as']);

// ---------------------------------------------------------------- saving: automatic (there is no Save button)
// Every change goes to the run about half a second after it is made, and at once when the focus leaves its card (POST
// /keep: review_decisions.json, under the server's write lock, refused once Finish has started); the browser's copy above
// stays as a backup. One save at a time: an edit made while a save is in flight marks the draft dirty, and the save after
// it (which sends the whole draft) carries it, so no edit is lost. The header says "All changes saved" or "Saving…" (not
// announced); only a failed save is announced, as an alert saying what to do.
let saveTimer = null, saving = false, dirty = false;
const saveState = t => { const el = document.getElementById('saveState'); if (el) el.textContent = t; };
function saveAlert(t) { document.getElementById('saveAlert').textContent = t || ''; if (t) saveState('Not saved'); }
function saveSoon() {
  if (finished || DATA.mode === 'ocr') return;         // the OCR-only page has no draft to save
  dirty = true; saveState('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500);
}
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  if (saving || finished) return;                      // the save in flight looks at `dirty` when it ends
  saving = true; dirty = false; let ok = false;
  try {
    const at = state.saved_at, [s, b] = await post('/keep');
    if (s === 200) { ok = true; saveAlert(''); gotCheck(b, at); refreshMoves(b.move_previews); }   // kept, or skipped as older than the draft on disk
    else if (s === 409) ok = true;                     // Finish has started: it records the draft itself
    else saveAlert('Your last changes could not be saved to the run: ' + (b.error || 'the server refused them') + ' Change it and they are saved again.');
  } catch (e) {
    saveAlert('Your last changes could not be saved to the run: the review page has closed, or the app stopped. They are kept in this browser; open the review again from the run page to carry on.');
  } finally {
    saving = false;
    if (dirty && !finished) { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }   // edits made meanwhile: saved next (one timer)
    else if (ok) saveState('All changes saved');
  }
}
// Leaving the page while a change hasn't reached the run (waiting for its save, or a save in flight): the browser asks
// first (its leave-page prompt). If the person leaves anyway, the last edits are sent as the page goes (keepalive). A
// browser sends at most 64 KiB that way: a bigger draft is not sent then, which is why the prompt comes first; the
// browser's own copy keeps it either way.
const unsaved = () => (dirty || saving) && !finished && DATA.mode !== 'ocr';
addEventListener('beforeunload', e => { if (unsaved()) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('pagehide', () => {
  if (!unsaved()) return;
  const body = JSON.stringify(Object.assign({}, state));
  if (body.length > 60000) return;                     // over the keepalive limit: the browser's copy has it
  try { fetch('/keep', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body }); } catch (e) {}
});
// the gaps still open (from each auto-save), beside the save status: not announced; the Finish dialog lists them with Add links
function tableReading(r) {             // shown, not edited here: reject the card if the row reading is wrong
  if (!r) return '';
  const part = [r.title_rows && r.title_rows + ' title row(s) become the caption', r.note_rows && r.note_rows + ' note row(s) move after the table',
                r.group_rows && 'group rows ' + r.group_rows.join(', '), r.repeat_rows && 'repeated header rows ' + r.repeat_rows.join(', ')].filter(Boolean);
  return part.length ? '; ' + esc(part.join('; ')) : '';
}
// ---------------------------------------------------------------- field checks: the check's verdict on each card, from each save
// Every save (/keep, and the Finish dialog's /save) returns problems: what the check (the rules the AI's decisions go
// through) would drop, each on the card it belongs to (review/core.py problems). A card's message sits under its value,
// tied to the field (aria-invalid, aria-describedby) and not announced itself. It changes only when the card is not being
// typed in (the focus is elsewhere, or no typing for 1 second); a problem that is fixed clears at once. The line beside
// "Finish Review" (announced, only when its words change) counts what the cards show, with the gaps. A response to a
// save older than the draft (an edit made while it was on its way) is not used: the save after it brings the verdict.
let PROBS = null, GAPS = [], marks = {}, lastInput = 0, settleTimer = null, lineText = '';
const ERR_IDS = {}; let errN = 0;
const errId = id => ERR_IDS[id] || (ERR_IDS[id] = 'err-' + (++errN));   // card ids hold spaces: never in an id list
const cardName = id => { const t = byId[id] || addById[id]; return t ? (t.kind || '') + ': ' + String(t.label).slice(0, 80) : id; };
const probLink = id => byId[id] || addById[id] ? '<a href="#card-' + esc(id) + '" data-card="card-' + esc(id) + '">' + esc(cardName(id)) + '</a>' : esc(cardName(id));   // in a card: goCard
const NOT_YOURS = { ai: ' This is the AI\'s choice: reject it to continue, or change it.',
                    earlier: ' This choice was carried over from an earlier session: reject it to continue, or change it.' };
function gotCheck(b, at) {

}
function wanted() {                                    // card id → {html, parts, whole} the latest problems ask for

  for (const p of P.fields || []) put(p.card, esc(p.fix) + (NOT_YOURS[p.origin] || ''), p.parts);
  for (const c of P.conflicts || []) for (const id of c.cards)
    put(id, esc(c.fix) + (c.cards.length > 1 ? ' It conflicts with ' + c.cards.filter(x => x !== id).map(probLink).join(' and ') + '.' : '') + (NOT_YOURS[c.origin] || ''));
  return w;
}
const typing = el => el && el.contains(document.activeElement) && Date.now() - lastInput < 1000;
function settle() {
