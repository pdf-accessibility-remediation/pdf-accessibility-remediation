<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work order review</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #5f5f5a; --line: #d9d9d4;
  --accent: #1f5fae; --ok: #1d7a3e; --change: #9a5b00; --reject: #b3261e; --seen: #5a4fa8; --flag: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1e; --ink: #ecece8; --muted: #a3a39c; --line: #3a3a37;
          --accent: #7fb0f0; --ok: #6fcf8f; --change: #f0b45c; --reject: #f08a80; --seen: #b3a9f5; --flag: #3a3220; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.bar { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--accent); }
button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (prefers-color-scheme: dark) { button.primary { color: #111; } }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
textarea { width: 100%; min-height: 3.2em; }
#msg { margin-top: 6px; font-size: 14px; }
#msg.err { color: var(--reject); }
main { display: flex; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
nav { flex: 0 0 220px; position: sticky; top: 110px; align-self: flex-start; max-height: calc(100vh - 130px); overflow: auto; font-size: 14px; }
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
nav a { display: flex; justify-content: space-between; color: var(--ink); text-decoration: none; padding: 2px 4px; border-radius: 4px; }
nav a:hover { background: var(--line); }
#cards { flex: 1; min-width: 0; }
section > h2 { font-size: 16px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.card[data-status=approved] { border-left-color: var(--ok); }
.card[data-status=changed] { border-left-color: var(--change); }
.card[data-status=rejected] { border-left-color: var(--reject); }
.card[data-status=seen] { border-left-color: var(--seen); }
.card:not([data-status]) { opacity: .92; }
.flag { background: var(--flag); padding: 0 6px; border-radius: 4px; color: var(--ink); }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0 0 4px; }
.fields dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.fields dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.fields pre { margin: 0; }
.edit-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.exact { font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
.exact summary { cursor: pointer; }
.card .id { font-size: 11px; color: var(--muted); margin-top: 6px; }
.card .id code { font-size: 11px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } .fields dd { margin-bottom: 4px; } }
.ctx { font-size: 14px; color: var(--muted); margin: 4px 0; overflow-wrap: anywhere; }
pre { font-size: 12px; background: var(--bg); padding: 6px; border-radius: 6px; overflow: auto; max-height: 220px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.imgs figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.imgs img { max-height: 220px; max-width: 100%; border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; }
.imgs figure.here img { outline: 3px solid var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 6px; }
.controls label { cursor: pointer; }
.edit { margin-top: 6px; }
.edit textarea { min-height: 4.5em; }
.note { margin-top: 6px; }
.note textarea { min-height: 2.2em; font-size: 14px; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
#zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
.done { padding: 12px 16px; background: var(--flag); border-radius: 8px; margin: 10px 0; }
@media (max-width: 800px) { main { flex-direction: column; padding: 16px; } nav { position: static; max-height: none; flex: none; } header.top { position: static; } }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Work order review</h1>
  <div class="row">
    <label>Reviewer <input type="text" id="reviewer" placeholder="your name" size="18"></label>
    <span><span class="bar"><i id="bar"></i></span> <span id="progress"></span></span>
    <span role="radiogroup" aria-label="Show">Show:
      <label><input type="radio" name="view" value="priority" checked> Check first</label>
      <label><input type="radio" name="view" value="all"> All</label>
      <label><input type="radio" name="view" value="left"> Not reviewed</label>
    </span>
    <button id="save">Save</button>
    <button id="finish" class="primary">Finish review</button>
  </div>
  <div id="msg" role="status"></div>
</header>
<main>
  <nav id="nav" aria-label="Sections"></nav>
  <div id="cards"></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const DATA = /*REVIEW_DATA*/null;
const KEY = 'review:' + DATA.book + ':' + DATA.run;
const SEEN_ONLY = new Set(['deferrals', 'notes_for_reviewer']);
const items = DATA.items, byId = Object.fromEntries(items.map(it => [it.id, it]));
let state = { reviewer: (DATA.saved && DATA.saved.reviewer) || '', decisions: (DATA.saved && DATA.saved.decisions) || {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.decisions) state = s; } catch (e) {}
let view = 'priority', finished = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pg = (p, lab) => p == null ? '' : 'PDF p. ' + p + (lab && String(lab) !== String(p) ? ' (printed ' + lab + ')' : '');
const show = v => v == null || v === '' ? '—' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function dec(id) { return state.decisions[id] || (state.decisions[id] = {}); }

document.getElementById('title').textContent = 'Work order review · ' + DATA.book + ' · ' + DATA.pages + ' pages';
const rv = document.getElementById('reviewer'); rv.value = state.reviewer;
rv.addEventListener('input', () => { state.reviewer = rv.value; persist(); });

function sections() {
  if (view === 'priority') {
    const out = [];
    for (const g of Object.keys(DATA.groups).map(Number)) {
      let its = items.filter(it => it.priority === g);
      its.sort((a, b) => g === 2 ? (b.context.count || 0) - (a.context.count || 0) : (a.page ?? 1e9) - (b.page ?? 1e9));
      if (its.length) out.push({ id: 'grp-' + g, title: g + '. ' + DATA.groups[g], items: its });
    }
    return out;
  }
  const kinds = [];
  for (const it of items) if (!kinds.includes(it.kind)) kinds.push(it.kind);
  return kinds.map(k => ({ id: 'kind-' + k.replace(/\W+/g, '-'), title: k,
    items: items.filter(it => it.kind === k && (view !== 'left' || !(state.decisions[it.id] || {}).status))
      .sort((a, b) => (a.page ?? 1e9) - (b.page ?? 1e9)) })).filter(s => s.items.length);
}

// ---------------------------------------------------------------- plain-language descriptions
const TAG_WORD = { H1: 'level-1 heading, the title', H2: 'level-2 heading', H3: 'level-3 heading', H4: 'level-4 heading', H5: 'level-5 heading',
                   H6: 'level-6 heading', P: 'paragraph', Span: 'inline text (Span)', Caption: 'caption', Note: 'note', Div: 'block (Div)', Figure: 'figure' };
const tagWord = t => t == null ? '—' : (TAG_WORD[t] ? t + ' (' + TAG_WORD[t] + ')' : String(t));
const isHeading = t => /^H[1-6]$/.test(t || '');
const article = t => TAG_WORD[t] ? (/^[aeiou]/i.test(TAG_WORD[t]) ? 'an ' : 'a ') + TAG_WORD[t] : (t || 'something else');
function artifactWord(type, sub) {
  const k = (type || '') + '/' + (sub || '');
  return { 'Pagination/Header': 'page header (running head)', 'Pagination/Footer': 'page footer', 'Pagination/PageNum': 'page number',
           'Pagination/Watermark': 'watermark' }[k] || [type, sub].filter(Boolean).join(' / ').toLowerCase() || 'decoration';
}
const KEY_WORDS = {
  sections: 'Tells the executor where the contents, notes and index sections are, so their pages are structured to match.',
  links: 'Fixes the text of links in the table of contents.',
  language: 'Marks passages in another language, so screen readers switch voice and pronunciation for them.',
  toc: 'Structures the table of contents as a list of entries.',
  captions: 'Groups captions with the figures they describe.',
  lists: 'Rebuilds lists the source tagged as separate paragraphs.',
  notes: 'Tags footnotes or endnotes as notes.',
  move_section: 'Moves a run of pages to another place in the reading order.',
  move_to_document_start: 'Moves these elements to the start of the reading order.',
  adopt_orphans: 'Attaches text that no tag owns to the tags around it, so screen readers can reach it.',
  fix_figure_order: 'Puts figures back on their own page in the reading order.',
  remove_empty_containers: 'Removes empty structure tags.',
};
function explain(it) {
  const b = it.before, a = it.ai, c = it.context;
  switch (it.key) {
    case 'retype':
      return 'Changes this one element from ' + article(b) + ' to ' + article(a) + '. ' +
        (isHeading(a) && !isHeading(b) ? 'Screen readers will announce it as a heading and list it in their headings menu.'
         : isHeading(b) && !isHeading(a) ? 'Screen readers will no longer announce it as a heading or list it in the headings menu.'
         : isHeading(a) && isHeading(b) ? 'It moves to level ' + a.slice(1) + ' in the document outline.' : '');
    case 'rolemap':
      return 'Changes what the style “' + c.style + '” means: all ' + (c.count ?? 'its') + ' elements with this style are read as ' + article(a) +
             ' instead of ' + article(b) + '. One wrong element in the style means one wrong heading.';
    case 'actual_text': return 'Sets the words screen readers speak for this element in place of the printed characters (used where the print reads wrongly). The page does not change.';
    case 'alt': return 'Sets the description screen readers give for this figure (its alt text). The page does not change.';
    case 'page_figures': return 'Wraps this whole page as one figure, with this description for screen readers.';
    case 'document':
      return { title: 'Sets the document title that screen readers announce and the window shows.',
               lang: 'Sets the document\'s main language, which picks the screen reader\'s voice and pronunciation.',
               display_doc_title: 'Shows the title (not the file name) in the window\'s title bar.',
               remove_empty_acroform: 'Removes an empty form definition that has no fields.' }[it.loc[1]] || 'Sets a document setting.';
    case 'tables': return 'Marks the first ' + a.header_rows + ' row(s) and first ' + a.header_cols + ' column(s) as headers, so screen readers announce them with each cell.';
    case 'flatten': return 'Removes the list or table structure; its contents are read as plain paragraphs.';
    case 'keep_lists': return 'Keeps this one-item list as a list (an automatic rule would otherwise turn it into a paragraph).';
    case 'merges': return 'Joins two pieces into one heading, for example a chapter number and its title, so they are read together.';
    case 'artifacts':
      return it.loc[1] === 'elements' ? 'Marks this figure as decoration, so screen readers skip it. Right for ornaments and backgrounds with no information.'
        : 'Marks matching text as decoration, so screen readers skip it. Right for running heads and page numbers; if the pattern also matches real content, that content is hidden too.';
    case 'ocr_words': return 'Tells screen readers to read this OCR word with the corrected spelling. The page does not change.';
    case 'deferrals': return 'The AI did not decide this and left it to a person. Nothing is applied; mark it Seen once you have looked.';
    case 'notes_for_reviewer': return 'The AI\'s general note to the reviewer. Nothing is applied; mark it Seen once you have read it.';
  }
  return KEY_WORDS[it.key] || 'Another instruction to the executor (“' + it.key + '”). Approve or reject it as a whole.';
}
function entryWords(it) {
  const a = it.ai;
  if (it.key === 'merges') return 'Each “' + a.style + '” element joins the ' + (a.direction === 'prev' ? 'previous' : 'next') + ' “' + (a.with || []).join('” or “') + '” element';
  if (it.key === 'flatten' || it.key === 'keep_lists') return it.label;
  if (typeof a === 'boolean') return a ? 'yes' : 'no';
  if (Array.isArray(a)) return a.length + ' entr' + (a.length === 1 ? 'y' : 'ies') + ' (see the exact entry below)';
  if (a && typeof a === 'object') return Object.keys(a).filter(k => k !== 'confidence' && k !== 'why').map(k => k.replace(/_/g, ' ') + ': ' + show(a[k])).join(' · ');
  return show(a);
}

function editor(it, d) {
  const v = d.status === 'changed' && 'value' in d ? d.value : it.ai;
  if (it.edit === 'level') return '<select data-act="value">' + it.options.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
    (it.key === 'rolemap' && it.context.count ? ' <span class="flag">changes all ' + it.context.count + ' elements of this style</span>' : '');
  if (it.edit === 'text') return '<textarea data-act="value" aria-label="New value">' + esc(v) + '</textarea>';
  if (it.edit === 'lang') return '<input type="text" data-act="value" value="' + esc(v) + '" size="12"> <span class="ctx">a language tag such as en-US, ja, haw</span>';
  if (it.edit === 'table') return 'Header rows <input type="text" data-act="value" data-f="header_rows" size="2" value="' + esc((v || {}).header_rows) + '"> ' +
    'Header columns <input type="text" data-act="value" data-f="header_cols" size="2" value="' + esc((v || {}).header_cols) + '"> <span class="ctx">0–3 each</span>';
  return '';
}

function card(it) {
  const d = state.decisions[it.id] || {}, c = it.context, st = d.status || '';
  let h = '<article class="card" id="card-' + esc(it.id) + '" data-id="' + esc(it.id) + '"' + (st ? ' data-status="' + st + '"' : '') + '>';
  const rows = [];
  const row = (k, v) => rows.push('<dt>' + k + '</dt><dd>' + v + '</dd>');
  const where = pg(it.page, it.page_label);
  const span = it.pages && it.pages[0] != null && it.pages[1] !== it.pages[0] ? 'PDF pp. ' + it.pages[0] + '–' + it.pages[1] : '';
  row('Page', esc(span || where || 'not on one page'));
  row('Decision type', esc(it.kind) + (c.confidence != null && c.confidence < 1 ? ' <span class="flag">AI confidence ' + esc(c.confidence) + ' (below 1: the AI was unsure)</span>' : ''));
  const what = { retype: 'Text on the page', actual_text: 'Text on the page', rolemap: 'Style', alt: 'Figure', page_figures: 'Figure',
                 document: 'Document setting', tables: 'Table', ocr_words: 'OCR word', deferrals: 'What the AI left to a person',
                 notes_for_reviewer: 'From', artifacts: 'Rule', flatten: 'Element', keep_lists: 'Element', merges: 'Merge' }[it.key] || 'Decision';
  row(what, '<b>' + esc(it.label) + '</b>');
  row('What this does', esc(explain(it)));
  let exact = false;                                   // show the AI's exact entry under "details" instead of in the card
  if (it.key === 'retype' || it.key === 'rolemap')
    row('Change', 'Original: <b>' + esc(tagWord(it.before)) + '</b> → AI: <b>' + esc(tagWord(it.ai)) + '</b>');
  else if (['alt', 'page_figures', 'actual_text', 'ocr_words', 'document'].includes(it.key)) {
    row('Original', it.before == null || it.before === '' ? 'none' : esc(show(it.before)));
    row('AI\'s choice', '<b>' + esc(show(it.ai)) + '</b>');
  } else if (it.key === 'tables')
    row('Change', 'Original: <b>' + esc(show(it.before.header_cells)) + '</b> header cells → AI: <b>' + esc(it.ai.header_rows) + '</b> header rows, <b>' + esc(it.ai.header_cols) + '</b> header columns');
  else if (it.key === 'deferrals') row('Why', esc(c.why || '—'));
  else if (it.key === 'notes_for_reviewer') row('Note', esc(it.ai));
  else if (it.key === 'artifacts') {
    const r = it.ai || {}; exact = true;
    if (r.regex) row('Hides', 'text matching <code>' + esc(r.regex) + '</code>');
    else if (r.where === 'in_figure') row('Hides', 'untagged text inside figures');
    else if (it.loc[1] === 'elements') row('Hides', 'this whole figure');
    if (r.band) row('Where on the page', esc({ top: 'top of the page (running-head area)', bottom: 'bottom of the page (footer area)', any: 'anywhere on the page' }[r.band] || r.band));
    if (r.type || r.subtype) row('Marked as', esc(artifactWord(r.type, r.subtype)));
  } else { if (it.key !== 'flatten' && it.key !== 'keep_lists') row('AI\'s choice', esc(entryWords(it))); exact = true; }
  if (c.why && it.key !== 'deferrals') row('AI\'s reason', esc(c.why));
  if (c.count != null) row(it.key === 'ocr_words' ? 'Occurs' : 'Elements', esc(c.count) + (it.key === 'ocr_words' ? ' times in the book' : ' in this style'));
  if (c.samples) row('Samples', c.samples.map(x => '“' + esc(String(x).slice(0, 120)) + '”').join(' · '));
  if (c.first || c.first_rows) row('First rows', (c.first || c.first_rows).map(x => '“' + esc(String(x).slice(0, 100)) + '”').join(' · '));
  if (c.page_refs) row('Pages named', esc(c.page_refs.join(', ')));
  h += '<dl class="fields">' + rows.join('') + '</dl>';
  if (exact) h += '<details class="exact"><summary>The AI\'s exact entry</summary><pre>' + esc(JSON.stringify(it.ai, null, 1)) + '</pre></details>';
  const imgs = [];
  if (c.figure) imgs.push('<figure><img loading="lazy" src="_audit/' + esc(c.figure) + '" alt="The figure"><figcaption>figure</figcaption></figure>');
  for (const src of it.images || []) {
    const p = +src.match(/(\d+)\.png$/)[1];
    imgs.push('<figure' + (p === it.page ? ' class="here"' : '') + '><img loading="lazy" src="' + esc(src) + '" alt="PDF page ' + p + '"><figcaption>p. ' + p + '</figcaption></figure>');
  }
  if (imgs.length) h += '<div class="imgs">' + imgs.join('') + '</div>';
  const opts = SEEN_ONLY.has(it.key) ? [['seen', 'Seen']] : [['approved', 'Approve'], ...(it.edit ? [['changed', 'Change']] : []), ['rejected', 'Reject']];
  h += '<div class="controls" role="radiogroup" aria-label="Decision">' + opts.map(([v, l]) =>
    '<label><input type="radio" name="st-' + esc(it.id) + '" data-act="status" value="' + v + '"' + (st === v ? ' checked' : '') + '> ' + l + '</label>').join('') + '</div>';
  if (it.edit && !SEEN_ONLY.has(it.key)) h += '<div class="edit"' + (st === 'changed' ? '' : ' hidden') + '><div class="edit-label">New value</div>' + editor(it, d) + '</div>';
  h += '<div class="note"><textarea data-act="note" placeholder="Note (optional)" aria-label="Note">' + esc(d.note || '') + '</textarea></div>';
  h += '<div class="id">ID <code>' + esc(it.id) + '</code></div>';
  return h + '</article>';
}

function render() {
  const secs = sections();
  document.getElementById('cards').innerHTML = (finished ? '<div class="done">Review finished. Go back to the terminal to continue the run.</div>' : '') +
    (secs.length ? secs.map(s => '<section id="' + s.id + '"><h2>' + esc(s.title) + ' (' + s.items.length + ')</h2>' + s.items.map(card).join('') + '</section>').join('')
                 : '<p>Nothing to show here.</p>');
  nav(); progress();
}

function nav() {
  const g = Object.keys(DATA.groups).map(Number).map(n => [n, items.filter(it => it.priority === n).length]).filter(x => x[1]);
  const kinds = []; for (const it of items) if (!kinds.includes(it.kind)) kinds.push(it.kind);
  const pages = {};
  for (const it of items) if (it.priority && it.page != null) (pages[it.page] = pages[it.page] || []).push(it.id);
  let h = '<h2>Check first</h2>' + g.map(([n, c]) => '<a href="#grp-' + n + '" data-view="priority"><span>' + esc(DATA.groups[n]) + '</span><span>' + c + '</span></a>').join('');
  h += '<h2>All decisions</h2>' + kinds.map(k => '<a href="#kind-' + k.replace(/\W+/g, '-') + '" data-view="all"><span>' + esc(k) + '</span><span>' + items.filter(it => it.kind === k).length + '</span></a>').join('');
  h += '<h2>Page index</h2>' + Object.keys(pages).map(Number).sort((a, b) => a - b).map(p =>
    '<a href="#card-' + esc(pages[p][0]) + '" data-view="priority"><span>p. ' + p + '</span><span>' + pages[p].length + '</span></a>').join('');
  document.getElementById('nav').innerHTML = h;
}

function progress() {
  const n = items.filter(it => (state.decisions[it.id] || {}).status).length;
  document.getElementById('progress').textContent = n + ' of ' + items.length + ' reviewed';
  document.getElementById('bar').style.width = (items.length ? 100 * n / items.length : 0) + '%';
}

const cards = document.getElementById('cards');
function onEdit(e) {
  const el = e.target, act = el.dataset.act; if (!act || finished) return;
  const art = el.closest('.card'), it = byId[art.dataset.id], d = dec(it.id);
  if (act === 'status') {
    d.status = el.value;
    if (el.value === 'changed' && !('value' in d)) d.value = it.ai;
    const ed = art.querySelector('.edit'); if (ed) ed.hidden = el.value !== 'changed';
  } else if (act === 'note') d.note = el.value;
  else if (act === 'value') {
    if (it.edit === 'table') {
      const v = Object.assign({}, it.ai, d.value || {}); const n = el.value.trim();
      v[el.dataset.f] = /^\d+$/.test(n) ? +n : n; d.value = v;
    } else d.value = el.value;
    d.status = 'changed';
  }
  if (d.status) art.dataset.status = d.status;
  persist(); progress();
}
cards.addEventListener('change', onEdit);
cards.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA' || e.target.type === 'text') onEdit(e); });
cards.addEventListener('click', e => {
  if (e.target.tagName === 'IMG') { const z = document.getElementById('zoom'); z.querySelector('img').src = e.target.src; z.querySelector('img').alt = e.target.alt; z.style.display = 'flex'; }
});
document.getElementById('zoom').addEventListener('click', e => { e.currentTarget.style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('zoom').style.display = 'none'; });
document.querySelectorAll('input[name=view]').forEach(r => r.addEventListener('change', () => { view = r.value; render(); }));
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  if (a.dataset.view && a.dataset.view !== view && !(view === 'left' && a.dataset.view === 'all')) {
    view = a.dataset.view; document.querySelector('input[name=view][value=' + view + ']').checked = true; render();
    e.preventDefault(); const t = document.querySelector(a.getAttribute('href')); if (t) t.scrollIntoView();
  }
});

const msg = (t, err) => { const m = document.getElementById('msg'); m.innerHTML = t; m.className = err ? 'err' : ''; };
const dropText = d => d.length ? ' · <b>' + d.length + ' not accepted by the check</b>: ' + d.map(x => esc(x.where) + ' (' + esc(x.why) + ')').join('; ') : ' · nothing dropped by the check';
async function post(path, extra) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ reviewer: state.reviewer, decisions: state.decisions }, extra || {})) });
  return [r.status, await r.json()];
}
document.getElementById('save').addEventListener('click', async () => {
  try {
    const [s, b] = await post('/save');
    if (s !== 200) return msg(esc(b.error || 'Save failed'), true);
    msg('Saved · ' + b.changes + ' changes from the AI · ' + b.unreviewed + ' not reviewed yet' + dropText(b.dropped), b.dropped.length > 0);
  } catch (e) { msg('Could not reach the review server: is it still running in the terminal? Your choices are kept in this browser.', true); }
});
document.getElementById('finish').addEventListener('click', async () => {
  if (!state.reviewer.trim()) { rv.focus(); return msg('Enter your name as the reviewer first.', true); }
  try {
    let [s, b] = await post('/finish');
    if (s === 409) {
      if (!confirm(b.unreviewed.length + ' items are not reviewed. Accept them as the AI wrote them, and record that they were not reviewed?')) {
        view = 'left'; document.querySelector('input[name=view][value=left]').checked = true; render();
        return msg(esc(b.error) + ' They are listed under "Not reviewed".', true);
      }
      [s, b] = await post('/finish', { accept_unreviewed: true });
    }
    if (s !== 200) return msg(esc(b.error || 'Finish failed'), true);
    finished = true;
    document.querySelectorAll('#save, #finish').forEach(x => x.disabled = true);
    msg('Review finished · ' + b.changes + ' changes recorded' + dropText(b.dropped) + '. Go back to the terminal to continue the run.', b.dropped.length > 0);
    try { localStorage.removeItem(KEY); } catch (e) {}
    render();
  } catch (e) { msg('Could not reach the review server: is it still running in the terminal?', true); }
});
render();
</script>
</body>
</html>
