<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Order Review</title>
<style>
:root {
  color-scheme: light dark;            /* scrollbars and form controls follow the theme */
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #5f5f5a; --line: #d9d9d4;
  --accent: #1f5fae; --ok: #1d7a3e; --change: #9a5b00; --reject: #b3261e; --seen: #5a4fa8; --flag: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1e; --ink: #ecece8; --muted: #a3a39c; --line: #3a3a37;
          --accent: #7fb0f0; --ok: #6fcf8f; --change: #f0b45c; --reject: #f08a80; --seen: #b3a9f5; --flag: #3a3220; }
}
* { box-sizing: border-box; }
/* a jump to a card or section lands below the sticky header. On the targets, not as html's scroll-padding: that padding
   also covered the header's own reviewer field, so the browser scrolled the list on every key typed there */
main [id] { scroll-margin-top: calc(var(--top, 0px) + 8px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: center; }
.actions { display: flex; gap: 10px; }
.show label { margin-left: 8px; }
.bar { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--accent); }
button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (prefers-color-scheme: dark) { button.primary { color: #111; } }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
textarea { width: 100%; max-width: 100%; min-height: 3.2em; resize: vertical; }   /* taller only: never wider than its box */
.sname { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 0; } .sname[hidden] { display: none; }
.sname { margin-left: -14px; }   /* closer to the Reviewer box than the row's 32 px gap; what follows moves with it */
@media (max-width: 560px) { .sname { margin-left: 0; } }   /* a phone: it starts its own line */
.sname label { margin-right: 4px; } .sname #notesBtn { margin-left: 18px; }   /* the name close to its box; the notes button apart */
/* "Back to the Run Page": a link (it goes to another page) that looks like the header's buttons */
a.btnlink { display: inline-block; font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; }
a.btnlink:hover { text-decoration: underline; }
#back { margin: 0; }
/* Hide Header at the header's bottom right; while hidden, Show Header at the window's top right */
.hdr-foot { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
#hideHdr { margin-left: auto; font-size: 13px; padding: 3px 10px; }
#showHdr { position: fixed; top: 8px; right: 16px; z-index: 6; font-size: 13px; padding: 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
header.top[hidden], #showHdr[hidden] { display: none; }
/* the notepad: the session's notes beside the page (not modal), moved by its title bar, resized from its corner */
dialog.npad { position: fixed; margin: 0; padding: 0; inset: auto; width: min(420px, 92vw); height: 280px; min-width: 220px; min-height: 140px;
              max-width: 100vw; max-height: 100vh; resize: both; overflow: hidden; z-index: 30; border: 1px solid var(--muted);
              border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
dialog.npad[open] { display: flex; flex-direction: column; }
.npad-bar { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; background: var(--bg); border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
.npad-bar h2 { flex: 1; font-size: 15px; margin: 0; }
.npad-bar button, .msg-x { min-width: 28px; min-height: 28px; padding: 0 6px; border: 0; background: none; color: var(--ink); font-size: 18px; line-height: 1; }
dialog.npad textarea { flex: 1; resize: none; border: 0; border-radius: 0 0 8px 8px; min-height: 0; }
.npad-restore { position: fixed; right: 16px; bottom: 16px; z-index: 30; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.npad-restore[hidden] { display: none; }
#msg { margin-top: 6px; font-size: 14px; }
#msg:has(.msg-x) { display: flex; align-items: flex-start; gap: 8px; } #msg .msg-t { flex: 1; padding-top: 4px; }
#msg.err { color: var(--reject); }
#session { margin-top: 6px; font-size: 14px; color: var(--muted); }
#session b { color: inherit; } #session a { color: var(--accent); }
main { display: flex; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
nav { flex: 0 0 232px; padding-right: 12px; scrollbar-gutter: stable; position: sticky; top: calc(var(--top, 0px) + 8px); align-self: flex-start; max-height: calc(100vh - var(--top, 0px) - 24px); overflow: auto; overscroll-behavior: contain; font-size: 14px; }   /* its scrolling never moves the page */
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
nav a { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); text-decoration: none; padding: 2px 4px; border-radius: 4px; }
nav a:hover { background: var(--line); }
.col { flex: 1; min-width: 0; }
.card.added { border-left-color: var(--accent); }
#addPanel { background: var(--panel); border: 2px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#addPanel h2 { font-size: 16px; margin: 0 0 4px; }
#addPanel .pick { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 6px 0; }
#addPanel select[data-add=target] { width: 100%; }
#addPanel .buttons { display: flex; gap: 10px; margin-top: 8px; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; max-width: min(680px, 94vw); padding: 14px 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { font-size: 16px; margin: 0 0 6px; }
dialog .gap { border-top: 1px solid var(--line); padding: 8px 0; }
dialog .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 8px; }
#msg a { color: var(--accent); }
#gapErr { color: var(--reject); }
section > h2 { font-size: 16px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.card[data-status=approved] { border-left-color: var(--ok); }
.card[data-status=changed] { border-left-color: var(--change); }
.card[data-status=rejected] { border-left-color: var(--reject); }
.card[data-status=seen] { border-left-color: var(--seen); }
.card:not([data-status]) { opacity: .92; }
.flag { background: var(--flag); padding: 0 6px; border-radius: 4px; color: var(--ink); }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0 0 4px; }
.fields dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.fields dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.fields pre { margin: 0; }
.edit-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.exact { font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
.exact summary { cursor: pointer; }
.card .id { font-size: 11px; color: var(--muted); margin-top: 6px; }
.card .id code { font-size: 11px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } .fields dd { margin-bottom: 4px; } }
.ctx { font-size: 14px; color: var(--muted); margin: 4px 0; overflow-wrap: anywhere; }
pre { font-size: 12px; background: var(--bg); padding: 6px; border-radius: 6px; overflow: auto; max-height: 220px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.imgs figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.imgs img { max-height: 220px; max-width: 100%; border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; }
.imgs figure.here img { outline: 3px solid var(--accent); }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }   /* a section, card or heading focused by script: no outline */
.controls { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 6px; }
.controls label { cursor: pointer; }
button.clear { padding: 1px 8px; font-size: 13px; color: var(--muted); }
.navbar { display: none; }
#navToggle { display: inline-flex; align-items: center; gap: 8px; border-color: var(--accent); color: var(--accent); font-weight: 600; }
#navToggle svg { width: 18px; height: 18px; }
.nav-head { display: none; }
#navBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
#navBackdrop[hidden] { display: none; }
.imgs figure.word img { max-height: 90px; }
.edit { margin-top: 6px; }
.edit textarea { min-height: 4.5em; }
.note { margin-top: 6px; }
.note textarea { min-height: 2.2em; font-size: 14px; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
#zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
.done { padding: 12px 16px; background: var(--flag); border-radius: 8px; margin: 10px 0; }
/* the session's notes (its name is in the header); the notes of the session this one started from, read-only. The box is a
   block, so no line gap under it: the fold below sits centred between the box and the section's edge */
#this-session textarea { display: block; }
#this-session { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#this-session > h2 { margin-top: 0; }
#this-session h2 label { display: block; cursor: pointer; }   /* the section's heading is the notes box's label */
#finishDialog label { display: block; font-weight: 600; margin: 6px 0 2px; }
#this-session textarea, #finishDialog textarea { min-height: 5em; }
#finishDialog input[type=text] { width: 100%; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.from-notes { margin-top: 10px; }
.from-notes summary { cursor: pointer; }
.from-notes .pre { background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
/* OCR Text: the book's OCR text, shown as it is, and a person's verdict on it (never an edit of the text) */
#ocr-text { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
#ocr-text > h2 { margin-top: 0; }
#ocr-text fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 0 10px 6px; }
#ocr-text legend { font-weight: 600; padding: 0 4px; margin-bottom: -2px; }
/* each choice: its radio centred on its label, the name semi-bold */
#ocr-text fieldset label { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; white-space: nowrap; font-weight: 600; }
#ocr-text fieldset input[type=radio] { margin: 0; }
#ocr-text .cur-verdict { margin-bottom: 2px; }
#ocr-text .prev-verdicts { margin: 0 0 10px; } #ocr-text .prev-verdicts ul { margin-top: 2px; }
#ocr-text .field { margin: 6px 0; }
#ocr-text .field > label { display: block; font-weight: 600; margin-bottom: 2px; }
#ocr-text .field input[type=text] { width: 100%; max-width: 40em; }
#ocr-text #ocrMsg { margin: 8px 0; }
#ocr-text #ocrMsg.err { color: var(--reject); }
.ocr-card h3 { font-size: 15px; margin: 0 0 6px; }
.ocr-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.ocr-pair img { max-width: 100%; border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; }
.ocr-pair pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 520px; font-size: 13px; margin: 0; }
.ocr-card ul { margin: 6px 0; padding-left: 20px; font-size: 14px; }
@media (max-width: 800px) { .ocr-pair { grid-template-columns: 1fr; } }
@media (max-width: 800px) {
  main { flex-direction: column; padding: 16px; }
  header.top { position: static; }
  .navbar { display: block; position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  /* the side list becomes a drawer over the page: the cards never move */
  /* align-self: stretch, or the desktop flex-start makes the drawer as tall as its list and nothing scrolls */
  nav { position: fixed; top: 0; bottom: 0; left: 0; align-self: stretch; width: min(300px, 85vw); max-height: none; overscroll-behavior: contain; z-index: 20; background: var(--panel);
        box-shadow: 2px 0 16px rgba(0,0,0,.35); padding: 8px 16px 16px; transform: translateX(-100%); visibility: hidden;
        transition: transform .2s ease, visibility 0s linear .2s; }
  body.nav-open nav { transform: none; visibility: visible; transition: transform .2s ease; }
  .nav-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
}
@media (prefers-reduced-motion: reduce) { nav { transition: none !important; } }
</style>
</head>
<body>
<button type="button" id="showHdr" class="hdr-toggle" aria-expanded="false" aria-controls="top" hidden>Show Header</button>
<header class="top" id="top">
  <h1 id="title" tabindex="-1">Work Order Review</h1>
  <div class="row">
    <label>Reviewer <input type="text" id="reviewer" placeholder="Your name" size="18"></label>
    <span class="sname"><label for="sessionName">Session Name</label><input type="text" id="sessionName" maxlength="80" size="18"><button type="button" id="notesBtn" aria-expanded="false" aria-controls="notepad">Session Notes</button></span>
    <span><span class="bar"><i id="bar"></i></span> <span id="progress"></span></span>
    <span class="show" role="radiogroup" aria-label="Show">Show:
      <label><input type="radio" name="view" value="priority" checked> Check First</label>
      <label><input type="radio" name="view" value="all"> All</label>
      <label><input type="radio" name="view" value="left"> Not Reviewed</label>
    </span>
    <span class="actions"><button id="addBtn" type="button">Add a Decision</button> <button id="save">Save</button>
    <button id="finish" class="primary">Finish Review</button><button id="closeOcr" type="button" hidden>Close Without a Verdict</button></span>
  </div>
  <div id="msg" role="status"></div>
  <div id="session" hidden></div>
  <div class="hdr-foot"><p id="back" hidden><a href="" class="btnlink">Back to the Run Page</a> (this review stays open; continue it from there)</p>
  <button type="button" id="hideHdr" class="hdr-toggle" aria-expanded="true" aria-controls="top">Hide Header</button></div>
</header>
<!-- the session's notes as a notepad beside the page: the same note as the Session Notes box (typing in either updates both) -->
<dialog id="notepad" class="npad" aria-labelledby="npadTitle">
  <div class="npad-bar"><h2 id="npadTitle">Session Notes</h2>
    <button type="button" id="npadMin" aria-label="Minimize Session Notes"><span aria-hidden="true">–</span></button>
    <button type="button" id="npadX" aria-label="Close Session Notes"><span aria-hidden="true">×</span></button></div>
  <textarea id="padNotes" maxlength="4000" aria-labelledby="npadTitle"></textarea>
</dialog>
<button type="button" id="npadRestore" class="npad-restore" hidden>Session Notes</button>
<div class="navbar"><button id="navToggle" type="button" aria-expanded="false" aria-controls="nav">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>Sections</button></div>
<div id="navBackdrop" hidden></div>
<main>
  <nav id="nav" aria-label="Sections"><div class="nav-head"><span>Sections</span><button id="navClose" type="button" aria-label="Close Sections"><span aria-hidden="true">×</span></button></div><div id="navList"></div></nav>
  <div class="col">
    <section id="this-session" aria-labelledby="tsTitle"><h2 id="tsTitle"><label for="sessionNotes">Session Notes (optional)</label></h2>
      <textarea id="sessionNotes" maxlength="4000"></textarea>
      <div id="fromNotes"></div>
    </section>
    <section id="ocr-text" aria-labelledby="ocrTitle" hidden></section>
    <div id="addPanel" hidden></div><div id="cards"></div></div>
</main>
<div id="zoom"><img alt=""></div>
<dialog id="gapDialog" aria-labelledby="gapTitle" aria-describedby="gapCtx"></dialog>
<dialog id="finishDialog" aria-labelledby="finTitle" aria-describedby="finCtx"></dialog>
<script>
const DATA = /*REVIEW_DATA*/null;
// the browser draft belongs to one run and one session (the run id is written once, in reviews/basis.json)
const SESSION = DATA.session || null;
const KEY = SESSION && SESSION.key ? 'review:' + SESSION.key : 'review:' + DATA.book + ':' + DATA.run;
const SEEN_ONLY = new Set(['deferrals', 'notes_for_reviewer']);
const items = DATA.items, byId = Object.fromEntries(items.map(it => [it.id, it]));
const ADDABLE = DATA.addable || {}, ADD_KINDS = DATA.add_kinds || {};
const addById = Object.fromEntries(Object.values(ADDABLE).flat().map(t => [t.id, t]));
const aid = a => 'add:' + a.kind + ':' + a.target;
// the server's saved choices, or this browser's when they are newer (both stamped with the browser's clock)
const srv = DATA.saved || {};
let state = { reviewer: srv.reviewer || '', decisions: srv.decisions || {}, additions: srv.additions || [],
              session_name: srv.session_name || '', session_notes: srv.session_notes || '', saved_at: srv.saved_at || '' };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && s.decisions && (!state.saved_at || (s.saved_at && new Date(s.saved_at) >= new Date(state.saved_at)))) state = Object.assign({ additions: [] }, s);
} catch (e) {}
state.additions = (state.additions || []).filter(a => addById[aid(a)]);
let view = 'priority', finished = false;
const RETURN_TO = DATA.return_to || null;             // the app's run page (review_workorder.py --return-to), else the terminal
if (RETURN_TO) { const b = document.getElementById('back'); b.hidden = false; b.querySelector('a').href = RETURN_TO.split('?')[0]; }
const NEXT = RETURN_TO ? 'the run page' : 'the terminal';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Title Case for labels (headings, row labels, toggles, buttons); explanatory text stays in sentence case. The rule of
// lib/titles.py: a, an, the, and, or, of, to, in, on, for, by, from, with stay lowercase unless first, last, or first after a
// colon or question mark; a word with a capital inside, a dot, slash, underscore or digit is left as written, and so is
// everything in parentheses (a qualifier stays lowercase: "Sent to (optional)").
const SMALL = new Set(['a', 'an', 'the', 'and', 'or', 'of', 'to', 'in', 'on', 'for', 'by', 'from', 'with']);
function tc(s) {
  const w = String(s).split(' '); let edge = true, depth = 0;
  return w.map((x, n) => {
    const i = x.search(/[^("'*[`]/), core = i < 0 ? '' : x.slice(i), first = edge || n === w.length - 1;
    const inside = depth > 0 || /^["'*[`]*\(/.test(x);
    depth = Math.max(0, depth + (x.match(/\(/g) || []).length - (x.match(/\)/g) || []).length);
    edge = /[:?—]$/.test(x);
    if (inside) return x;
    if (!core || !/^\p{L}/u.test(core) || /[./_@\d]/.test(core) || /\p{Lu}/u.test(core.slice(1))) return x;
    if (!first && SMALL.has(core.replace(/[:?!.,;)"'*`\]]+$/, ''))) return x;
    return x.slice(0, i) + core[0].toUpperCase() + core.slice(1);
  }).join(' ');
}
const pg = (p, lab) => p == null ? '' : 'PDF p. ' + p + (lab && String(lab) !== String(p) ? ' (printed ' + lab + ')' : '');
const show = v => v == null || v === '' ? '—' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
function persist() { state.saved_at = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function dec(id) { return state.decisions[id] || (state.decisions[id] = {}); }

document.getElementById('title').textContent = 'Work Order Review · ' + DATA.book + ' · ' + DATA.pages + ' pages';
if (SESSION && SESSION.reopened) {                    // a finished run reviewed again: where this session started, OCR
  const sn = id => 'Session ' + Number(id), nc = SESSION.not_carried || [];
  const ocr = DATA.ocr ? ' · <a href="#ocr-text" id="hdrOcrLink">OCR Text</a>: <span id="hdrOcr"></span>' : '';   // filled by renderOcr()
  const el = document.getElementById('session'); el.hidden = false;
  el.innerHTML = 'Reviewing again: <b>' + sn(SESSION.id) + '</b>, started from ' + esc(SESSION.from_text) +
    (SESSION.from !== 'ai' ? ' · ' + SESSION.carried + ' choices preloaded' + (nc.length ? ' · <b>' + nc.length + ' not carried</b> (the decision is not the same; shown as not reviewed): ' + nc.slice(0, 6).map(x => esc(x.id)).join(', ') + (nc.length > 6 ? ' …' : '') : '') : '') +
    ocr + ' · "Finish Review" re-applies the reviewed order (no AI call).';
} else if (DATA.ocr && DATA.mode !== 'ocr') {            // a first review: the status line has the OCR verdict alone
  const el = document.getElementById('session'); el.hidden = false;
  el.innerHTML = '<a href="#ocr-text" id="hdrOcrLink">OCR Text</a>: <span id="hdrOcr"></span>';
}
// the OCR verdict is recorded on its own: never counted in "N of M reviewed" or in Finish's count of decisions not reviewed
const rv = document.getElementById('reviewer'); rv.value = state.reviewer;
rv.addEventListener('input', () => { state.reviewer = rv.value; persist(); });

// ---------------------------------------------------------------- this session's name and notes
// prefilled "Session N"; kept in the browser on every key, and on the server when a field loses focus (the review page's
// port can change, and the browser's copy is per port), with Save, and with Finish
const NAME_DEFAULT = (SESSION && SESSION.name_default) || 'Session 1';
const sName = document.getElementById('sessionName'), sNotes = document.getElementById('sessionNotes');
sName.value = state.session_name || NAME_DEFAULT; sNotes.value = state.session_notes || '';
sName.addEventListener('input', () => { state.session_name = sName.value; persist(); });
const padNotes = document.getElementById('padNotes'); padNotes.value = sNotes.value;
// one note, two boxes (the section's and the notepad's): typing in either updates the other and the draft

function sections() {

}
function aiSections() {
  if (view === 'priority') {
    const out = [];
    for (const g of Object.keys(DATA.groups).map(Number)) {
      let its = items.filter(it => it.priority === g);
      its.sort((a, b) => g === 2 ? (b.context.count || 0) - (a.context.count || 0) : (a.page ?? 1e9) - (b.page ?? 1e9));
      if (its.length) out.push({ id: 'grp-' + g, title: g + '. ' + DATA.groups[g], items: its });
    }
    return out;
  }
  const kinds = [];
  for (const it of items) if (!kinds.includes(it.kind)) kinds.push(it.kind);
  return kinds.map(k => ({ id: 'kind-' + k.replace(/\W+/g, '-'), title: k,
    items: items.filter(it => it.kind === k && (view !== 'left' || !(state.decisions[it.id] || {}).status))

// ---------------------------------------------------------------- plain-language descriptions
const TAG_WORD = { H1: 'level-1 heading, the title', H2: 'level-2 heading', H3: 'level-3 heading', H4: 'level-4 heading', H5: 'level-5 heading',
                   H6: 'level-6 heading', P: 'paragraph', Span: 'inline text (Span)', Caption: 'caption', Note: 'note', Div: 'block (Div)', Figure: 'figure' };
const tagWord = t => t == null ? '—' : (TAG_WORD[t] ? t + ' (' + TAG_WORD[t] + ')' : String(t));

           'Pagination/Watermark': 'watermark' }[k] || [type, sub].filter(Boolean).join(' / ').toLowerCase() || 'decoration';
}
const KEY_WORDS = {
  sections: 'Tells the executor where the contents, notes and index sections are, so their pages are structured to match.',
  links: 'Fixes the text of links in the table of contents.',
  language: 'Marks passages in another language, so screen readers switch voice and pronunciation for them.',
  toc: 'Structures the table of contents as a list of entries.',
  captions: 'Groups captions with the figures they describe.',
  lists: 'Rebuilds lists the source tagged as separate paragraphs.',
  notes: 'Tags footnotes or endnotes as notes.',
  move_section: 'Moves a run of pages to another place in the reading order.',
  move_to_document_start: 'Moves these elements to the start of the reading order.',
  adopt_orphans: 'Attaches text that no tag owns to the tags around it, so screen readers can reach it.',
  fix_figure_order: 'Puts figures back on their own page in the reading order.',
  remove_empty_containers: 'Removes empty structure tags.',
};
const h1Note = (a, b, it) => (a === 'H1' || b === 'H1') && !it.added ? ' To make a different element the H1 instead, use “Add a decision” at the top of the page.' : '';
function explain(it) {
  const b = it.before, a = it.ai, c = it.context;
  switch (it.key) {
    case 'retype':
      if (a === b) return 'Keeps this one element as ' + article(a) + ', even where a style mapping changes the other elements of its style.' + h1Note(a, b, it);
      return 'Changes this one element from ' + article(b) + ' to ' + article(a) + '. ' +
        (isHeading(a) && !isHeading(b) ? 'Screen readers will announce it as a heading and list it in their headings menu.'
         : isHeading(b) && !isHeading(a) ? 'Screen readers will no longer announce it as a heading or list it in the headings menu.'
         : isHeading(a) && isHeading(b) ? 'It moves to level ' + a.slice(1) + ' in the document outline.' : '') + h1Note(a, b, it);
    case 'rolemap':
      return 'Changes what the style “' + c.style + '” means: all ' + (c.count ?? 'its') + ' elements with this style are read as ' + article(a) +
             ' instead of ' + article(b) + '. One wrong element in the style means one wrong heading.' + h1Note(a, b, it);
    case 'actual_text': return 'Sets the words screen readers speak for this element in place of the printed characters. The page does not change. The executor only accepts words that are printed under the element: if they come from a heading merge (for example “Chapter Two”), they depend on that merge being approved.';
    case 'alt': return 'Sets the description screen readers give for this figure (its alt text). The page does not change.';
    case 'page_figures': return 'Wraps this whole page as one figure, with this description for screen readers.';
    case 'document':
      return { title: 'Sets the document title that screen readers announce and the window shows.',
               lang: 'Sets the document\'s main language, which picks the screen reader\'s voice and pronunciation.',
               display_doc_title: 'Shows the title (not the file name) in the window\'s title bar.',
               remove_empty_acroform: 'Removes an empty form definition that has no fields.' }[it.loc[1]] || 'Sets a document setting.';
    case 'tables': return 'Marks the first ' + a.header_rows + ' row(s) and first ' + a.header_cols + ' column(s) as headers, so screen readers announce them with each cell.';
    case 'flatten': return 'Removes the list or table structure; its contents are read as plain paragraphs.';
    case 'keep_lists': return 'Keeps this one-item list as a list (an automatic rule would otherwise turn it into a paragraph).';
    case 'merges': return 'Joins two pieces into one heading, for example a chapter number and its title, so they are read together. If you reject it, spoken text the AI wrote for those headings (for example “Chapter Two …”) no longer matches the print, and the executor will refuse it too.';
    case 'artifacts':

function entryWords(it) {

  if (it.key === 'flatten' || it.key === 'keep_lists') return it.label;
  if (typeof a === 'boolean') return a ? 'yes' : 'no';
  if (Array.isArray(a)) return a.length + ' entr' + (a.length === 1 ? 'y' : 'ies') + ' (see the exact entry below)';
  if (a && typeof a === 'object') return Object.keys(a).filter(k => k !== 'confidence' && k !== 'why').map(k => k.replace(/_/g, ' ') + ': ' + show(a[k])).join(' · ');
  return show(a);

    const value = readValue(document.getElementById('addDetail'), t.default);
    if (value === '' || value == null) return msg('Enter a value first.', true);
    const note = panel.querySelector('[data-add=note]').value;
    state.additions.push(Object.assign({ kind: t.kind, target: t.target, value }, note ? { note } : {}));
    persist(); panel.hidden = true;
    if (view === 'left') { view = 'priority'; document.querySelector('input[name=view][value=priority]').checked = true; }
    render(); msg('Added. Save checks it with the same rules as the AI\'s decisions.');
    goTo(document.getElementById('card-' + t.id));                // the new card, with focus
  }
});
document.getElementById('addBtn').addEventListener('click', () => panel.hidden ? openAdd() : (panel.hidden = true));

// a message under the header's buttons; one that stays (dismiss) has a "×" (accessible name "Dismiss message"), as the
// run page's messages do
const msg = (t, err, dismiss) => {
  const m = document.getElementById('msg'); m.className = err ? 'err' : '';
  m.innerHTML = dismiss ? '<span class="msg-t">' + t + '</span><button type="button" class="msg-x" data-act="dismiss" aria-label="Dismiss message"><span aria-hidden="true">×</span></button>' : t;
};
document.getElementById('msg').addEventListener('click', e => {
  if (e.target.closest('button[data-act=dismiss]')) { msg(''); document.getElementById('title').focus(); return; }   // focus to the page's heading
  const a = e.target.closest('a[data-add-kind]'); if (!a) return;
  e.preventDefault(); openAdd(a.dataset.addKind, a.dataset.addTarget);
});
const dropText = d => d.length ? ' · <b>' + d.length + ' not accepted by the check, so not applied at all</b> (the AI\'s value is not used either; change or approve it to keep a value): ' + d.map(x => esc(x.where) + ' (' + esc(x.why) + ')').join('; ') : ' · nothing dropped by the check';
const refusedText = r => (r || []).length ? ' · <b>' + r.length + ' additions refused</b>: ' + r.map(x => esc(x.id) + ' (' + esc(x.why) + ')').join('; ') : '';
const addLink = g => g.add ? ' <a href="#" data-add-kind="' + esc(g.add.kind) + '"' + (g.add.target != null ? ' data-add-target="' + esc(g.add.target) + '"' : '') + '>Add</a>' : '';
const gapText = g => (g || []).length ? ' · <b>' + g.length + ' gap' + (g.length === 1 ? '' : 's') + '</b>: ' + g.map(x => esc(x.what) + addLink(x)).join(' · ') : ' · no gaps';
async function post(path, extra) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ reviewer: state.reviewer, decisions: state.decisions, additions: state.additions,
      session_name: state.session_name, session_notes: state.session_notes, saved_at: state.saved_at }, extra || {})) });
  return [r.status, await r.json()];
}
document.getElementById('save').addEventListener('click', async () => {
  try {
    const [s, b] = await post('/save');
    if (s !== 200) return msg(esc(b.error || 'Save failed'), true);
    msg('Saved · ' + b.changes + ' changes from the AI · ' + b.unreviewed + ' not reviewed yet' + refusedText(b.refused) + dropText(b.dropped) + gapText(b.gaps),
        b.dropped.length > 0 || (b.refused || []).length > 0);
  } catch (e) { msg('This page can\'t reach its server: the review was closed, or the app stopped. Your choices are kept in this browser.', true); }
});
// gaps left open at Finish: the reviewer gives a reason for each, or goes back to add what is missing
function askGaps(gaps) {
  const dlg = document.getElementById('gapDialog');
  dlg.innerHTML = '<h2 id="gapTitle" tabindex="-1">Still Missing</h2><div class="ctx" id="gapCtx">The review can finish with these open, but each needs a reason; it is recorded with the review and shown in the report next to the gap.</div>' +
    gaps.map(g => '<div class="gap"><div>' + esc(g.what) + '</div><textarea data-gap="' + esc(g.id) + '" placeholder="Why it is left open (for example: decorative, or someone else writes these)" aria-label="Reason">' + esc(((SESSION || {}).gaps_ack || {})[g.id] || '') + '</textarea>' +
      (g.add ? '<button type="button" data-addinstead="' + esc(g.add.kind) + '"' + (g.add.target != null ? ' data-target="' + esc(g.add.target) + '"' : '') + '>Add Instead</button>' : '') + '</div>').join('') +
    '<div class="err" id="gapErr" role="alert"></div><div class="buttons"><button type="button" data-g="back">Back</button><button type="button" class="primary" data-g="finish">Finish with These Reasons</button></div>';
  return new Promise(done => {
    const close = v => { dlg.close(); dlg.onclick = null; done(v); };
    dlg.onclick = e => {
      const t = e.target;
      if (t.dataset.g === 'back') close(null);
      if (t.dataset.addinstead) { close(null); openAdd(t.dataset.addinstead, t.dataset.target); }
      if (t.dataset.g === 'finish') {
        const ack = {}; dlg.querySelectorAll('textarea[data-gap]').forEach(x => { if (x.value.trim()) ack[x.dataset.gap] = x.value.trim(); });
        if (Object.keys(ack).length < gaps.length) { document.getElementById('gapErr').textContent = 'Give a reason for each, or go back and add what is missing.'; return; }
        close(ack);
      }
    };
    dlg.oncancel = () => done(null);
    dlg.showModal(); document.getElementById('gapTitle').focus();   // read from the top: the title, then its explanation
  });
}
// every Finish: the session's name and notes for a last edit, and what finishing does with decisions not reviewed
const finBtn = document.getElementById('finish');
function showLeft(text) {
  view = 'left'; document.querySelector('input[name=view][value=left]').checked = true; render();
  msg(text + ' They are listed under "Not Reviewed".', true, true);
}
// names of buttons, views and sections in quotes, as they appear on screen (CLAUDE.md's interface rule)
function askFinish() {
  const dlg = document.getElementById('finishDialog');
  const n = items.filter(it => !(state.decisions[it.id] || {}).status).length, one = n === 1;
  const ov = OCR && OCR.current ? verdictText(OCR.current) : 'Not yet reviewed';
  dlg.innerHTML = '<h2 id="finTitle" tabindex="-1">Finish Review</h2><div class="ctx" id="finCtx">' +
    (n ? n + (one ? ' decision is' : ' decisions are') + ' not reviewed: "Finish Review" records ' + (one ? 'it' : 'them') + ' as the AI wrote ' + (one ? 'it' : 'them') +
         ', marked "accepted without review", and "Ready to Ship?" stays No.' : 'Every decision has a choice.') +
    (SESSION && SESSION.reopened ? ' "Finish Review" re-applies the reviewed order (no AI call).' : '') + ' The name and notes go to "Session History".' +
    (OCR ? ' "OCR Text": ' + esc(ov) + '. An OCR verdict is recorded on its own under "OCR Text", not with "Finish Review".' : '') + '</div>' +
    '<label for="finName">Session Name</label><input type="text" id="finName" maxlength="80">' +
    '<label for="finNotes">Session Notes (optional)</label><textarea id="finNotes" maxlength="4000"></textarea>' +
    '<div class="buttons"><button type="button" data-f="back">Back</button>' + (n ? '<button type="button" data-f="left">Show "Not Reviewed"</button>' : '') +
    '<button type="button" class="primary" data-f="finish">Finish Review</button></div>';
  document.getElementById('finName').value = sName.value; document.getElementById('finNotes').value = sNotes.value;
  return new Promise(done => {
    let answer = null;
    dlg.onclick = e => {
      const f = e.target.dataset.f; if (!f) return;
      if (f === 'finish') {                            // the dialog's name and notes are the session's from now on
        sName.value = state.session_name = document.getElementById('finName').value;
        sNotes.value = padNotes.value = state.session_notes = document.getElementById('finNotes').value; persist();
        answer = { unreviewed: n };
      }
      if (f === 'left') answer = 'left';
      dlg.close();
    };
    dlg.onclose = () => {
      dlg.onclick = dlg.onclose = null;
      if (answer === 'left') showLeft(n + ' decisions are not reviewed.');
      else if (!answer) finBtn.focus();                // Back or Escape: where the person was
      done(answer && answer !== 'left' ? answer : null);
    };
    dlg.showModal(); document.getElementById('finTitle').focus();   // read from the top: the title, then what finishing does
  });
}
finBtn.addEventListener('click', async () => {
  if (!state.reviewer.trim()) return needName();
  const go = await askFinish(); if (!go) return;
  try {
    const extra = go.unreviewed ? { accept_unreviewed: true } : {};
    let [s, b] = await post('/finish', extra);
    // not finished yet, a normal step (200, needs): decisions not reviewed that the dialog did not count, then the open gaps
    if (s === 200 && b.needs === 'unreviewed') return showLeft(esc(b.error));
    if (s === 200 && b.needs === 'gaps') {
      const ack = await askGaps(b.gaps);
      if (!ack) return msg('Not finished' + gapText(b.gaps), true);
      extra.gaps_ack = ack;
      [s, b] = await post('/finish', extra);
    }
    if (s !== 200 || !b.finished) return msg(esc(b.error || 'Finish failed'), true);
    finished = true; panel.hidden = true;
    document.querySelectorAll('#save, #finish, #addBtn, #sessionName, #sessionNotes, #padNotes').forEach(x => x.disabled = true);
    msg('Review finished · ' + b.changes + ' changes recorded' + dropText(b.dropped) + (b.gaps.length ? ' · ' + b.gaps.length + ' gaps left open, with your reasons' : '') +
        (RETURN_TO ? '. Going to the run page, which shows what happens next.' :
         SESSION && SESSION.reopened ? '. The terminal is re-applying it now (no AI call); the current result is replaced when that finishes.' : '. Go back to the terminal to continue the run.'), b.dropped.length > 0);
    try { localStorage.removeItem(KEY); } catch (e) {}
    render();
    if (RETURN_TO) location.assign(RETURN_TO);         // the person's own Finish opens the run page, with the re-apply's progress
  } catch (e) { msg('This page can\'t reach its server: the review was closed, or the app stopped. Your choices are kept in this browser.', true); }
});
renderOcr();
render();
</script>
</body>
</html>
