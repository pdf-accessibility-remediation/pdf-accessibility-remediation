name: PDF validation

on:
  push:
    branches: ["**"]
    paths:
      - "pipeline/**"
      - "prompts/**"
      - "samples/**"
      - ".github/workflows/pdf-validation.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "prompts/**"
      - "samples/**"
      - ".github/workflows/pdf-validation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache veraPDF
        id: verapdf-cache
        uses: actions/cache@v6
        with:
          path: ~/verapdf
          key: verapdf-1.30.3-${{ hashFiles('pipeline/verapdf/install.sh') }}

      - name: Install veraPDF
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        run: VERAPDF_VERSION=1.30.3 bash pipeline/verapdf/install.sh ~/verapdf

      - name: Audit a sample PDF (with veraPDF on the original)
        working-directory: pipeline
        run: |
          export VERAPDF="$HOME/verapdf/verapdf"
          python vera.py --check
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          python audit.py ../samples/tagged/northkorea.pdf "$audit_dir"
          python -c 'import json, sys; v = json.load(open(sys.argv[1])); "not_run" in v and sys.exit(v["not_run"]); print(v["totals"])' "$audit_dir/verapdf.json"

  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: [hawaii3, globalasias, northkorea, fishers, moralfoods, teika, migrant, ilokano, romanization-ocr]   # pipeline/tests/baseline/meta.json, one job each
        python: ["3.14"]                        # the version the baseline was made with (meta.json)
    name: regression (${{ matrix.book }}, Python ${{ matrix.python }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache veraPDF
        id: verapdf-cache
        uses: actions/cache@v6
        with:
          path: ~/verapdf
          key: verapdf-1.30.3-${{ hashFiles('pipeline/verapdf/install.sh') }}

      - name: Install veraPDF
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        run: VERAPDF_VERSION=1.30.3 bash pipeline/verapdf/install.sh ~/verapdf

      - name: Regression test (saved replies, no API call)
        working-directory: pipeline
        run: VERAPDF="$HOME/verapdf/verapdf" python tools/regression.py --books ${{ matrix.book }} --out "$RUNNER_TEMP/regression"

      - name: Keep the runs for a failed comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-runs-${{ matrix.book }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/regression
          retention-days: 7

  reorder-case:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: One section move on hawaii3 (hand-written reply, no API call)
        working-directory: pipeline
        run: VERAPDF=off python tools/reorder_case.py --out "$RUNNER_TEMP/reorder-1"

      - name: Two section moves on hawaii3
        if: ${{ !cancelled() }}                 # runs even when the one-move case failed
        working-directory: pipeline
        run: VERAPDF=off python tools/reorder_case.py --moves 2 --out "$RUNNER_TEMP/reorder-2"

      - name: Keep the runs for a failed reorder case
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reorder-case
          path: ${{ runner.temp }}/reorder-*
          retention-days: 7
