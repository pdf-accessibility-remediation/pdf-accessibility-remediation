name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q pipeline

      - name: Check shell scripts
        run: |
          bash -n pipeline/run_api.sh
          bash -n pipeline/batch_api.sh

      - name: Audit dependencies
        run: python -m pip install pip-audit && pip-audit -r pipeline/requirements.txt
